# background
background_opacity 0.80

# cursor
cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0.0

# text
font_size 12.0
font_hinting_style full
modify_font strikethrough_position 2px

# spacing
modify_font cell_height -1px
modify_font cell_width 100%

# colors
foreground #cccccc
background #000000
cursor     #cccccc

# Black
color0 #000000
color8 #555555

# Red
color1 #ff5555
color9 #ff5555

# Green
color2 #55ff55
color10 #55ff55

# Yellow
color3 #ffff55
color11 #ffff55

# Blue
color4 #5555ff
color12 #5555ff

# Magenta
color5 #ff55ff
color13 #ff55ff

# Cyan
color6 #55ffff
color14 #55ffff

# White
color7 #ffffff
color15 #ffffff
